# IMPORTANT: Do not move this file in your repo! Make sure it's located at .github/workflows/claude-dispatch.yml

name: Claude Code Dispatch

# IMPORTANT: Do not modify this `on` section!

on:
  repository_dispatch:
    types: [claude-dispatch]

jobs:
  claude-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      # - name: Preliminary Setup
      #   run: |
      #     echo "Setting up environment..."
      #     # Add any preliminary setup commands here to setup Claude's dev environment
      #     # e.g., npm install, etc.

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1.0.159
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # v1 auto-detects the execution mode; the old `mode` input was removed
          # and is rejected as "Unexpected input(s)".
          # https://github.com/anthropics/claude-code-action/blob/main/docs/migration-guide.md
          claude_args: |
            --model claude-sonnet-4-6

          # Optional: Allow Claude to run specific commands
          # claude_args: |
          #   --allowedTools "Bash(terraform fmt:*),Bash(terraform validate:*)"

          # Optional: Custom environment variables for Claude
          # settings: '{"env":{"TF_IN_AUTOMATION":"1"}}'
